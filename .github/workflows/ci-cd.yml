name: CI/CD

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

# Un nouveau push sur une PR annule l'exécution précédente ; les push sur dev et main vont au bout
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]   # version minimale déclarée et version locale
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Installation des dépendances
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"

      - name: Tests et couverture
        run: make coverage

      # Non bloquant tant que dev contient des erreurs ruff : le rapport est lu par Sonar
      - name: Rapport ruff
        if: matrix.python-version == '3.11'
        run: .venv/bin/ruff check . --exit-zero --output-format=json --output-file=ruff-report.json

      - name: Transmission des rapports au job Sonar
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapports-qualite
          path: |
            coverage.xml
            rapport-tests.xml
            ruff-report.json
          if-no-files-found: error
          retention-days: 7

  sonar:
    name: Analyse SonarQube Cloud
    needs: tests
    # L'offre gratuite n'analyse que les PR et la branche principale (main), jamais dev
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # historique complet : Sonar en a besoin pour repérer le code nouveau

      - name: Récupération des rapports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rapports-qualite
          path: .

      - name: Analyse et Quality Gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
