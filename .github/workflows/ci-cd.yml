name: CI/CD

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

# Un nouveau push sur une PR annule l'exécution précédente ; les push sur dev et main vont au bout
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]   # version minimale déclarée et version locale
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Installation des dépendances
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"

      - name: Lint (ruff)
        if: matrix.python-version == '3.11'
        run: make lint

      - name: Tests et couverture
        run: make coverage

      - name: Transmission des rapports au job Sonar
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapports-qualite
          path: |
            coverage.xml
            rapport-tests.xml
          if-no-files-found: error
          retention-days: 7

  sonar:
    name: Analyse SonarQube Cloud
    needs: tests
    # L'offre gratuite n'analyse que les PR et la branche principale (main), jamais dev
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # historique complet : Sonar en a besoin pour repérer le code nouveau

      - name: Récupération des rapports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rapports-qualite
          path: .

      - name: Analyse et Quality Gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  image:
    name: Image Docker
    needs: [tests, sonar]
    # Sonar est ignoré sur les push vers dev : on accepte « skipped », pas un échec
    if: ${{ !cancelled() && needs.tests.result == 'success' && (needs.sonar.result == 'success' || needs.sonar.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Construction de l'image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: revia-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test de démarrage de l'image
        run: |
          docker run -d --name api -p 8000:8000 \
            -e API_TOKEN=jeton-de-test -e GEMINI_API_KEY=cle-factice revia-api:test
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          # Jeton valide et fichier qui n'est pas un PDF : 400 attendu, sans appel à Gemini.
          # Un 500 signalerait un provider impossible à construire (cache non accessible en écriture…)
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-API-Token: jeton-de-test' \
            -F 'file=@pyproject.toml' http://127.0.0.1:8000/v1/qcm)
          echo "POST /v1/qcm -> $code"
          test "$code" = 400

      - name: Journaux du conteneur
        if: failure()
        run: docker logs api

      - name: Tags de l'image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=sha
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Publication uniquement après un merge (push sur dev ou main), jamais depuis une PR
      - name: Connexion à ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publication sur ghcr.io
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
