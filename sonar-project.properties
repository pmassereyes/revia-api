# Analyse SonarQube Cloud, lancée par la CI (.github/workflows/ci-cd.yml)
sonar.organization=pmassereyes
sonar.projectKey=pmassereyes_revia-api
sonar.projectName=revia-api

sonar.sources=app
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11, 3.12, 3.13, 3.14

# Rapports produits par le job de tests (make coverage)
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=rapport-tests.xml

# La CI échoue si le Quality Gate échoue
sonar.qualitygate.wait=true
